# Stage 11: app + PostgreSQL + Caddy (HTTPS for PlanFix webhooks).
# Env file (default ./.env): bot secrets + DOMAIN. Optional override:
#   export PAYBACK_ENV_FILE=$HOME/.config/payback/env
#   docker compose up --build -d
# Health: curl https://<DOMAIN from env>/health

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payback
      POSTGRES_PASSWORD: payback
      POSTGRES_DB: payback
    # Host port for local `make run` / `make test` (same credentials as app).
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payback -d payback"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - ${PAYBACK_ENV_FILE:-.env}
    environment:
      # Compose Postgres wins over a local sqlite DATABASE_URL in the env file.
      DATABASE_URL: postgresql+asyncpg://payback:payback@db:5432/payback
    # Reachable only on the Docker network; Caddy publishes 80/443.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${PAYBACK_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
